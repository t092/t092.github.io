<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Apps</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      color: #fff;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p.subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 16px;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.25);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    .card p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #fff;
      color: #333;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.25s;
    }

    .btn:hover {
      background: #f1f1f1;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Web App Collection</h1>
    <p class="subtitle">歡迎來到我的 GitHub Web App 入口頁</p>
  </header>

  <div class="container">

    <!-- App A -->
    <div class="card">
      <h2>歷史時空探險：</h2>
      <p>戰間期與二戰風雲</p>
      <a class="btn" href="https://t092.github.io/ww2/" target="_blank"> 點擊前往</a>
    </div>

    <!-- App B -->
    <div class="card">
      <h2>偉大的綠洲</h2>
      <p>自製廢土世界動作小遊戲。</p>
      <a class="btn" href="https://t092.github.io/WWM/" target="_blank"> 點擊前往</a>
    </div>

    <!-- 你可以複製這個區塊新增更多 App -->
    <!--
    <div class="card">
      <h2>App C</h2>
      <p>描述文字...</p>
      <a class="btn" href="https://username.github.io/C" target="_blank">前往 App C</a>
    </div>
    -->

  </div>

  <footer>
    © 2026 t092 — GitHub Pages
  </footer>

</body>
</html>
